name: Import Fragrance Atlas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'transfer/ready.json'

permissions:
  contents: write

concurrency:
  group: fragrance-atlas-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Restore and verify the original website
        run: python3 transfer/restore.py
      - name: Check JavaScript syntax
        run: npm run check
      - name: Commit website files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html preview.html assets downloads server.cjs package.json START_PREVIEW.bat .nojekyll .gitignore QA.md qa-results.json
          if git diff --cached --quiet; then
            echo 'All website files are already up to date.'
          else
            git commit -m 'Publish Fragrance Atlas website, dataset, workbook, and local preview'
            git push origin HEAD:main
          fi
