name: Sync fragrance house catalogs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-brand-catalog.yml'
      - 'scripts/sync_brand_catalog.py'
      - 'scripts/integrate_catalog.py'
      - 'scripts/publish_catalog.sh'
      - 'scripts/test_catalog.py'
      - 'verify.cjs'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write

concurrency:
  group: fragrance-catalog-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test, import and safely publish catalogs and site
        run: bash scripts/publish_catalog.sh
      - name: Record verified catalog counts
        run: node verify.cjs >> "$GITHUB_STEP_SUMMARY"
