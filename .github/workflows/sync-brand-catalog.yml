name: Sync fragrance house catalogs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-brand-catalog.yml"
      - "scripts/sync_brand_catalog.py"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build official-house catalog
        run: python scripts/sync_brand_catalog.py
      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-catalog.js brand-catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already current."
          else
            git commit -m "Sync Lattafa and French Avenue catalogs [skip ci]"
            git push
          fi
